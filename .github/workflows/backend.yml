name: Backend week 1
on:
  push:
  pull_request:
permissions:
  contents: read
# Push liên tiếp cùng nhánh thì hủy run cũ để không tốn runner và tránh queue dài.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # N1-8 (tuần 4): chặn secret ngay khi commit, không đợi tới review.
  # Tuần 3 đã lộ Jwt__SigningKey nằm trong render.yaml; job này làm lỗi đó tự báo đỏ.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 vì git grep cần lịch sử/thư mục làm việc đầy đủ.
          fetch-depth: 0
      - name: Quét secret
        run: bash deploy/scan-secrets.sh
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: culinary_test
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: culinary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U culinary_test -d culinary_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # MinIO đã gỡ toàn bộ image public (quay.io/minio/minio trả 401, docker.io/minio/minio
      # trả 404) nên runner không pull được và job chết ngay ở bước "Initialize containers".
      # RustFS là server S3-compatible Apache-2.0, nói đúng giao thức nên Minio SDK của
      # MinioStorageService dùng được không đổi dòng code. Endpoint sức khoẻ là /health,
      # không phải /minio/health/live. Ghim tag + digest để CI không lại vỡ khi upstream
      # đổi hoặc xoá tag (đúng nguyên nhân 5 run đỏ liên tiếp trước đó).
      objectstorage:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
          RUSTFS_CONSOLE_ENABLE: 'false'
          RUSTFS_VOLUMES: /data
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # Redis (N1-5/N1-6, tuần 4): cache dùng chung giữa nhiều API instance và distributed lock
      # cho sitemap phải chạy trên đúng stack thật, không mock. Trước đó CI không có Redis nên
      # /health/ready luôn 503 ⇒ test health không thể kỳ vọng dứt khoát được.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE: Host=localhost;Port=5432;Database=culinary_test;Username=culinary_test;Password=ci-ephemeral-only
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS: minioadmin
      MINIO_SECRET: minioadmin
      MINIO_BUCKET: culinary-blog
      # Dùng đúng tên biến chuẩn của ASP.NET Core (dấu __ phân tách section) để cấu hình thật sự
      # tới app, không chỉ tới script. Instance riêng cho CI để cache không đụng dữ liệu dev.
      Redis__Host: 127.0.0.1
      Redis__Port: '6379'
      Redis__Instance: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Ghim đúng bản SDK đã verify ở máy (khớp global.json rollForward latestFeature)
          # để SDK mới không làm đổi kết quả dotnet format hoặc sinh warning mới.
          dotnet-version: '10.0.401'
      - run: dotnet restore CulinaryBlog.sln --locked-mode
      - run: dotnet build CulinaryBlog.sln --no-restore --configuration Release
      - run: dotnet format CulinaryBlog.sln --verify-no-changes --no-restore
      - name: Wait for object storage
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:9000/health > /dev/null 2>&1; then
              echo "Object storage is ready"; exit 0
            fi
            sleep 1
          done
          echo "Object storage did not become ready in time"; exit 1
      # N1-2: probe credential storage phân biệt BucketNotFound (Unhealthy) với ObjectNotFound
      # (Healthy). Runner này khởi động RustFS với volume rỗng nên chưa có bucket, và HealthTests
      # tự bootstrap bucket qua IObjectStorageWriter. Bước này chỉ để log CI nói rõ dịch vụ nào
      # đã sẵn sàng, tránh mất thời gian debug khi test đỏ.
      #
      # Dùng /dev/tcp của bash thay vì redis-cli: runner ubuntu không cài redis-cli, chỉ có
      # nó BÊN TRONG service container. /dev/tcp vừa ping thật vừa không cần cài thêm gì.
      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if exec 3<>/dev/tcp/127.0.0.1/6379 2>/dev/null; then
              printf 'PING\r\n' >&3
              if head -n 1 <&3 | grep -q PONG; then
                echo "Redis is ready"; exec 3<&-; exit 0
              fi
              exec 3<&-
            fi
            sleep 1
          done
          echo "Redis did not become ready in time"; exit 1
      # --blame-hang-timeout: test treo sẽ bị bắt và dump thay vì để job treo tới hết 30 phút.
      - run: dotnet test CulinaryBlog.sln --no-build --configuration Release --blame-hang-timeout 10m --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults