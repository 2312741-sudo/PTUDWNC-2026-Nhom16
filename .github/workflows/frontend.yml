name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push liên tiếp cùng nhánh thì hủy run cũ để không tốn runner và tránh queue dài.
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5080/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      # N2-A2: trước khi có bước này, repo không có eslint config nào nên lint chưa bao giờ chạy.
      # Cố tình làm hỏng 1 lần để chứng minh cổng chặn được: thêm file gọi hook trong nhánh điều
      # kiện -> `react-hooks/rules-of-hooks` báo error, `npm run lint` exit 1, CI đỏ.
      # KHÔNG dùng `--max-warnings 0`: 8 cảnh báo `@next/next/no-img-element` là **có chủ đích** —
      # dự án dùng `<img referrerPolicy="no-referrer">` cho URL presigned, `next/image` sẽ đi
      # qua Next server và làm hỏng cơ chế ký URL (xem `docs/IMAGE_CONTRACT.md` §7b).
      - name: Lint (ESLint)
        run: npm run lint

      - name: Run unit tests (if configured)
        run: npm test --if-present

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-artifacts
          path: |
            src/frontend/.next
            !src/frontend/.next/cache
          retention-days: 7
