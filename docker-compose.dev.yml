# Stack dev cho cả nhóm (TV4/D5). Chạy: docker compose -f docker-compose.dev.yml up -d
# Lưu ý: dùng image có tag qua biến môi trường để dễ khóa phiên bản (D25);
# MINIO_TAG mặc định là latest chỉ cho phát triển cục bộ.
services:
  postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-pg
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: culinaryblog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:${MINIO_TAG:-latest}
    container_name: culinaryblog-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: culinaryblog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/culinary-blog &&
        mc anonymous set none local/culinary-blog
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: culinaryblog-mailhog
    ports:
      - "1025:1025"   # SMTP cho WelcomeEmail
      - "8025:8025"   # Web UI xem mail
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: culinaryblog-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"     # Web UI + intake
    volumes:
      - seqdata:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: culinaryblog-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
