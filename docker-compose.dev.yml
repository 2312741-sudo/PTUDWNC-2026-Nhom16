# Stack dev cho cả nhóm (TV4/D5). Chạy: docker compose -f docker-compose.dev.yml up -d
#
# ⚠️ Object storage KHÔNG dùng MinIO nữa: MinIO đã gỡ toàn bộ image public
# (quay.io/minio/minio → HTTP 401, docker.io/minio/minio → HTTP 404) nên image kéo về
# sẽ hỏng và mọi test E2E storage bị skip. Dùng RustFS (S3-compatible, Apache-2.0):
# nói đúng giao thức S3 nên MinioStorageService chạy được không đổi dòng code.
# Endpoint sức khoẻ là /health (RustFS không phục vụ /minio/health/live).
# Không có container init tạo bucket: MinioStorageService tự BucketExists -> MakeBucket.
# Chi tiết: docs/adr/ADR-TV4-002-doi-minio-sang-rustfs.md
#
# Lưu ý: dùng image có tag qua biến môi trường để dễ khóa phiên bản (D25);
# S3_TAG mặc định là 1.0.0 của RustFS, không dùng latest để tránh upstream đổi bất ngờ.
services:
  postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-pg
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: culinaryblog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  s3:
    # Ghim tag + digest (ADR-TV4-002, R1): tag bị đổi/xoá vẫn không làm hỏng local.
    # Digest mặc định là digest thật của rustfs/rustfs:1.0.0 (khớp CI .github/workflows/backend.yml).
    image: rustfs/rustfs:${S3_TAG:-1.0.0}@${S3_DIGEST:-sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    container_name: culinaryblog-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: culinaryblog-mailhog
    ports:
      - "1025:1025"   # SMTP cho WelcomeEmail
      - "8025:8025"   # Web UI xem mail
    restart: unless-stopped

  seq:
    # Ghim tag thay vì `latest` (ADR-TV4-002: đừng dựa vào tag latest bị upstream đổi).
    # Từ 2026.1, Seq bắt buộc có adminPassword hoặc noAuthentication ở lần chạy đầu;
    # đây là Seq dev-only nên tắt auth để máy mới dựng được ngay.
    image: datalust/seq:2026.1
    container_name: culinaryblog-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: 'true'
    ports:
      - "5341:80"     # Web UI + intake
    volumes:
      - seqdata:/data
    restart: unless-stopped

  otel-collector:
    # N1-3 (tuần 4): nhận OTLP từ API rồi in span ra log để kiểm chứng được "trace HTTP -> DB
    # thật". Trước đây chỉ cấu hình AddOtlpExporter trong code mà không có nơi nhận, nên trace
    # được gửi đi và rơi vào hư không — không ai xác minh được.
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: culinaryblog-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (AddOtlpExporter mặc định dùng gRPC)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - seq
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: culinaryblog-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
  seqdata:
