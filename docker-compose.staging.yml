# Docker Compose Staging Environment - CulinaryBlog (TV1 - Tuần 5)
# Sử dụng: docker compose -f docker-compose.staging.yml up -d --build

services:
  culinary-db:
    image: postgres:16-alpine
    container_name: staging-culinary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinary_blog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinary_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  culinary-redis:
    image: redis:7-alpine
    container_name: staging-culinary-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  culinary-s3:
    image: rustfs/rustfs:${S3_TAG:-1.0.0}@${S3_DIGEST:-sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    container_name: staging-culinary-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - staging_s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  culinary-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staging-culinary-api
    restart: unless-stopped
    depends_on:
      culinary-db:
        condition: service_healthy
      culinary-redis:
        condition: service_healthy
      culinary-s3:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Database: "Host=culinary-db;Port=5432;Database=culinary_blog;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "culinary-redis:6379"
      Minio__Endpoint: "culinary-s3:9000"
      Minio__Bucket: "culinary-blog"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSsl: "false"
      Jwt__SigningKey: "development-secret-key-that-is-at-least-64-bytes-long-for-jwt-signing-256-bits-security"
      Jwt__Issuer: "culinary-blog"
      Jwt__Audience: "culinary-blog-client"
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  culinary-frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: staging-culinary-frontend
    restart: unless-stopped
    depends_on:
      culinary-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
      NEXT_PUBLIC_SITE_URL: "http://localhost"
    ports:
      - "3000:3000"

  culinary-nginx:
    image: nginx:alpine
    container_name: staging-culinary-nginx
    restart: unless-stopped
    depends_on:
      - culinary-api
      - culinary-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro

volumes:
  staging_pgdata:
  staging_redisdata:
  staging_s3data:
