# LAB K23 - TV3: Nginx can bang tai round-robin cho 2 instance API lab
upstream lab_tv3_api {
    # Passive health check: 1 lan loi -> tam bo instance do 10s
    server lab-tv3-api1:8080 max_fails=1 fail_timeout=10s;
    server lab-tv3-api2:8080 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 6m;

    location / {
        proxy_pass http://lab_tv3_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Instance chet giua chung -> thu instance con lai thay vi tra 502 cho nguoi dung
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        add_header X-Upstream $upstream_addr always;
    }
}
