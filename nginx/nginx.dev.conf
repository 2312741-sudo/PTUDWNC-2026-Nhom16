# Nginx dev (TV4 D5) - proxy cho API chạy trên host (ASPNETCORE_URLS=http://localhost:5080).
# Frontend chưa có container; khi có sẽ thêm location / -> frontend.
events { }

http {
  upstream culinary_api {
    server host.docker.internal:5080;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://culinary_api/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_http_version 1.1;
    }

    location /health {
      proxy_pass http://culinary_api;
      proxy_set_header Host $host;
    }

    location = / {
      return 200 "CulinaryBlog dev gateway (frontend chua gan)\n";
    }
  }
}