# Nginx cho bài kiểm chứng 2 API instance (N1-5, tuần 4).
#
# Mục đích: chứng minh bằng chứng ở TẦNG HTTP rằng khi có nhiều tiến trình API, chúng
# dùng chung state qua Redis và load balancer thực sự chia traffic — không chỉ là
# "hai đối tượng trong một process".
#
# Cách chạy (xem logs/multi_instance_two_api.log):
#   1. Chạy API thứ nhất:  InstanceId=api-1  ASPNETCORE_URLS=http://127.0.0.1:5080
#   2. Chạy API thứ hai:  InstanceId=api-2  ASPNETCORE_URLS=http://127.0.0.1:5081
#   3. Chạy file cấu hình này (trong container: mount vào /etc/nginx/nginx.conf)
#   4. Gọi http://localhost:8088/api/v1/recipes nhiều lần, quan sát header X-Served-By
#      đổi giữa api-1 và api-2.
#
# nginx.dev.conf phục vụ luồng dev hằng ngày (một API trên host) nên không đụng vào.
events { }

http {
  # Round-robin mặc định. Không dùng least_conn/ip_hash vì mục tiêu là CHỨNG MINH
  # round-robin chia traffic, không phải tối ưu.
  upstream culinary_api_multi {
    # host.docker.internal, KHÔNG phải 127.0.0.1: nginx chạy trong container nên 127.0.0.1
    # trỏ về chính container đó và mọi request đều 502.
    server host.docker.internal:5080;   # api-1
    server host.docker.internal:5081;   # api-2
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://culinary_api_multi/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # Phải bám /health/ready chứ không /health/live: khi một instance mất Redis hoặc
    # sai credential storage, readiness trả 503 và nginx nên ngừng gửi traffic tới nó.
    location /health {
      proxy_pass http://culinary_api_multi;
      proxy_set_header Host $host;
    }

    location = / {
      return 200 "CulinaryBlog 2-instance gateway\n";
    }
  }
}
