# Nginx Staging Configuration - CulinaryBlog (TV1 - Tuần 5)
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Gzip Compression
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # W5-3 (TV4 08/10): 2 API instance. `server ... resolve;` + `resolver 127.0.0.11`
  # (DNS nội bộ Docker) → hostname culinary-api-2 chỉ được phân giải lúc runtime.
  # Khi chạy single mode (không có --profile multi, api-2 chưa tồn tại) nginx vẫn khởi động được.
  # passive health check FR-OBS-001 (tích hợp upstream): max_fails + fail_timeout → nginx tạm
  # ngừng gửi traffic tới peer lỗi; proxy_next_upstream chuyển request khi peer fail.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream culinary_backend {
    # zone bắt buộc khi dùng server ... resolve; (DNS động → peer giữ trong shared memory)
    zone culinary_backend 128k;
    server culinary-api:8080 max_fails=3 fail_timeout=10s;
    server culinary-api-2:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream culinary_frontend {
    server culinary-frontend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Backend API Routing
    location /api/ {
      proxy_pass http://culinary_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }

    # 2. Health Check Probes
    location /health {
      proxy_pass http://culinary_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout invalid_header http_502 http_503;
    }

    # 3. Scalar API Interactive Documentation
    location /scalar/ {
      proxy_pass http://culinary_backend/scalar/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # 4. OpenAPI Specification
    location /openapi/ {
      proxy_pass http://culinary_backend/openapi/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # 5. Frontend Next.js Web Application
    location / {
      proxy_pass http://culinary_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
