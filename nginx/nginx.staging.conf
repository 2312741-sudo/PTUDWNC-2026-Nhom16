# Nginx Staging Configuration - CulinaryBlog (TV1 - Tuần 5)
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Gzip Compression
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  upstream culinary_backend {
    server culinary-api:8080;
    keepalive 32;
  }

  upstream culinary_frontend {
    server culinary-frontend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Backend API Routing
    location /api/ {
      proxy_pass http://culinary_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }

    # 2. Health Check Probes
    location /health {
      proxy_pass http://culinary_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Scalar API Interactive Documentation
    location /scalar/ {
      proxy_pass http://culinary_backend/scalar/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # 4. OpenAPI Specification
    location /openapi/ {
      proxy_pass http://culinary_backend/openapi/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # 5. Frontend Next.js Web Application
    location / {
      proxy_pass http://culinary_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
