services:
  - type: web
    name: culinary-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/live
    envVars:
      - key: ConnectionStrings__Database
        fromDatabase:
          name: culinary-db
          property: connectionString
      - key: AllowedHosts
        value: "*"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # N1-8 (tuần 4): KHÔNG ghi secret vào repo. `sync: false` nghĩa là Render hỏi giá trị lúc
      # deploy và lưu trong secret store của Render; file này chỉ chứa tên biến.
      # Trước đây Jwt__SigningKey nằm thẳng trong file — ai đọc repo cũng ký được token admin.
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__Issuer
        value: culinary-blog
      - key: Jwt__Audience
        value: culinary-blog-client
      # B2 (issue #21): Cung cấp giá trị mặc định cho MinioOptions để startup validation không crash nếu chưa cấu hình S3 trên Render dashboard.
      - key: Minio__Endpoint
        value: "localhost:9000"
      - key: Minio__AccessKey
        value: "minioadmin"
      - key: Minio__SecretKey
        value: "minioadmin"
      - key: Minio__Bucket
        value: "culinary-blog"
      - key: Minio__UseSsl
        value: "false"
      # N1-5: cache và sitemap lock dùng chung qua Redis nên lấy thông tin từ Redis của Render.
      - key: Redis__Host
        fromService:
          type: redis
          name: culinary-redis
          property: host
      - key: Redis__Port
        fromService:
          type: redis
          name: culinary-redis
          property: port
      - key: Redis__Password
        fromService:
          type: redis
          name: culinary-redis
          property: password
      - key: Redis__Instance
        value: prod
      - key: Sitemap__BaseUrl
        sync: false

databases:
  - name: culinary-db
    plan: free
    databaseName: culinary_blog
    user: culinary_user
    region: singapore
    postgresMajorVersion: "16"
  # N1-5/N1-6: Redis dùng chung cho cache và khoá sitemap. ipAllowList rỗng nghĩa là chỉ
  # truy cập được từ trong mạng Render, không mở ra Internet.
  - name: culinary-redis
    type: redis
    plan: free
    region: singapore
    ipAllowList: []
